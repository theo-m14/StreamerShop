[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'php82', 'php82Packages.composer']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'yarn install'
]

[phases.build]
cmds = [
    'yarn build',
    'composer dump-autoload --optimize',
    'php bin/console cache:clear --env=prod'
]

[start]
cmd = 'php-fpm'

[variables]
APP_ENV = "prod"
APP_RUNTIME_ENV = "prod"
